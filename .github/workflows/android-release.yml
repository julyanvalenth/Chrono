# Builds the Android APK and publishes it on the GitHub Releases page.
#
# Release:   push a tag like v1.0.0   (git tag v1.0.0 && git push origin v1.0.0)
#            → a Release "v1.0.0" with chrono-v1.0.0.apk attached.
# Test build: Actions tab → "Android release" → Run workflow
#            → the APK is attached to the run as an artifact (no Release).
#
# The backend URL is baked into the app at build time (CHRONO_API_URL below, or the
# repository variable of the same name if set). It is a public URL, not a secret.
#
# Optional signing key (keeps the same signature across releases so updates install
# over the old app): add repository secrets ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Without them the APK is signed with a throwaway debug key.

name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the Release and upload the APK

env:
  CHRONO_API_URL: https://chrono-backend.vercel.app

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Set up release signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key secrets — using the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release signing key configured."

      - name: Build APK
        env:
          API_URL: ${{ vars.CHRONO_API_URL || env.CHRONO_API_URL }}
        run: |
          echo "Backend: $API_URL"
          flutter build apk --release --dart-define=CHRONO_API_URL="$API_URL"
          cp build/app/outputs/flutter-apk/app-release.apk "chrono-${GITHUB_REF_NAME//\//-}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: chrono-*.apk
          generate_release_notes: true
          body: |
            **Install on Android:** download `chrono-${{ github.ref_name }}.apk` below on your phone,
            open it, and allow "Install unknown apps" for your browser when asked.
            Then create an account in the app.

      - name: Attach APK to this run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: chrono-apk
          path: chrono-*.apk
