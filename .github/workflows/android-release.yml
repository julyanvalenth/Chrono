# Builds the Android APK and publishes it on the GitHub Releases page.
#
# Release:   push a tag like v1.0.0   (git tag v1.0.0 && git push origin v1.0.0)
#            → a Release "v1.0.0" with chrono-v1.0.0.apk attached.
# Test build: Actions tab → "Android release" → Run workflow
#            → the APK is attached to the run as an artifact (no Release).
#
# The backend URL is baked into the app at build time (CHRONO_API_URL below, or the
# repository variable of the same name if set). It is a public URL, not a secret.
#
# Optional signing key (keeps the same signature across releases so updates install
# over the old app): add repository secrets ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Without them the APK is signed with a throwaway debug key.
#
# Security: actions are pinned to commit SHAs (Dependabot keeps them updated, see
# .github/dependabot.yml). Only the small "release" job can write to the repo; the
# build job, which runs third-party tooling and holds the signing key, is read-only.

name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {} # nothing by default; each job asks for what it needs

env:
  CHRONO_API_URL: https://chrono-theta-nine.vercel.app
  FLUTTER_VERSION: 3.50.1 # same as the team's local setup (see README)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Set up release signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key secrets — using the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release signing key configured."

      - name: Build APK
        env:
          API_URL: ${{ vars.CHRONO_API_URL || env.CHRONO_API_URL }}
        run: |
          echo "Backend: $API_URL"
          flutter build apk --release --dart-define=CHRONO_API_URL="$API_URL"
          cp build/app/outputs/flutter-apk/app-release.apk "chrono-${GITHUB_REF_NAME//\//-}.apk"

      - name: Remove signing key from the runner
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrono-apk
          path: chrono-*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the Release and upload the APK
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrono-apk

      - uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          files: chrono-*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            **Install on Android:** download `chrono-${{ github.ref_name }}.apk` below on your phone,
            open it, and allow "Install unknown apps" for your browser when asked.
            Then create an account in the app.
